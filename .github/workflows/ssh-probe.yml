name: SSH Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: TCP check
        run: |
          for i in 1 2 3 4 5; do
            nc -vz -w 5 ${{ secrets.SELECTEL_HOST }} 22 && break
            sleep 3
          done
      - name: SSH echo
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SELECTEL_HOST }}
          username: ${{ secrets.SELECTEL_USER }}
          key: ${{ secrets.SELECTEL_SSH_KEY }}
          port: 22
          command_timeout: 2m
          request_pty: false
          script: |
            echo PROBE_OK
            hostname
            date -Is
            uptime
