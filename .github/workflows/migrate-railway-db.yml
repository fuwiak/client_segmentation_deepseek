name: Migrate Railway DB → Selectel

on:
  workflow_dispatch:

concurrency:
  group: migrate-db
  cancel-in-progress: true

jobs:
  migrate:
    name: Dump+restore on VDS
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Migrate over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          RAILWAY_DATABASE_PUBLIC_URL: ${{ secrets.RAILWAY_DATABASE_PUBLIC_URL }}
        with:
          host: ${{ secrets.SELECTEL_HOST }}
          username: ${{ secrets.SELECTEL_USER }}
          key: ${{ secrets.SELECTEL_SSH_KEY }}
          command_timeout: 40m
          envs: RAILWAY_DATABASE_PUBLIC_URL
          script: |
            set -euo pipefail
            echo "MIGRATE_START $(date -Is)"
            test -n "${RAILWAY_DATABASE_PUBLIC_URL:-}"
            mkdir -p /opt/migrate
            cd /opt/app
            PGPASS=$(grep -E '^POSTGRES_PASSWORD=' deploy/.env | cut -d= -f2-)
            test -n "$PGPASS"

            echo "=== Dump Railway (custom format) ==="
            docker run --rm \
              -e DATABASE_URL="$RAILWAY_DATABASE_PUBLIC_URL" \
              -v /opt/migrate:/out \
              postgres:18-alpine \
              sh -c 'pg_dump "$DATABASE_URL" --no-owner --no-acl -Fc -f /out/rail.dump && ls -lh /out/rail.dump'

            echo "=== Dump TOC (first objects) ==="
            docker run --rm -v /opt/migrate:/out:ro postgres:18-alpine \
              sh -c 'pg_restore -l /out/rail.dump | head -50'

            echo "=== Ensure local Postgres up ==="
            docker compose -f deploy/docker-compose.yml up -d postgres
            for i in $(seq 1 36); do
              st=$(docker inspect -f '{{.State.Health.Status}}' deploy-postgres-1 2>/dev/null || echo missing)
              echo "pg $st ($i)"
              [ "$st" = healthy ] && break
              sleep 5
            done

            echo "=== Reset schema ==="
            docker compose -f deploy/docker-compose.yml exec -T postgres \
              psql -U app -d app -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public; GRANT ALL ON SCHEMA public TO app; GRANT ALL ON SCHEMA public TO public;"

            echo "=== Restore ==="
            docker run --rm --network deploy_default \
              -v /opt/migrate:/out:ro \
              -e PGPASSWORD="$PGPASS" \
              postgres:18-alpine \
              pg_restore --no-owner --no-acl \
                -d "postgresql://app:${PGPASS}@postgres:5432/app" \
                /out/rail.dump \
              || echo "pg_restore warnings (often OK)"

            echo "=== Verify ==="
            docker compose -f deploy/docker-compose.yml exec -T postgres \
              psql -U app -d app -c "\dt"
            docker compose -f deploy/docker-compose.yml exec -T postgres \
              psql -U app -d app -Atc "SELECT relname||'='||n_live_tup FROM pg_stat_user_tables ORDER BY n_live_tup DESC LIMIT 20;"
            docker compose -f deploy/docker-compose.yml exec -T postgres \
              psql -U app -d app -Atc "SELECT 'customers='||count(*) FROM customers;" || true

            echo "=== Restart web ==="
            docker compose -f deploy/docker-compose.yml up -d web
            sleep 4
            curl -fsS -m 10 http://127.0.0.1:8000/health
            echo
            echo "MIGRATE_OK $(date -Is)"
