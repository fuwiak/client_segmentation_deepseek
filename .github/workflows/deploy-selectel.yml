name: Deploy Selectel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-selectel
  cancel-in-progress: true

env:
  APP_DIR: /opt/app

jobs:
  deploy:
    name: Selectel VDS
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: "0 · Link"
        run: |
          {
            echo "### Selectel deploy — live steps below"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "On VDS: \`tail -f /var/log/kinetic-deploy.log\` · status: \`cat /var/run/kinetic-deploy.status\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Watch steps 1→6 turn green. Build is usually the longest."

      - name: "1 · Sync git"
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SELECTEL_HOST }}
          username: ${{ secrets.SELECTEL_USER }}
          key: ${{ secrets.SELECTEL_SSH_KEY }}
          port: 22
          command_timeout: 5m
          request_pty: true
          script: |
            set -euo pipefail
            APP_DIR=/opt/app
            REPO_URL=https://github.com/fuwiak/client_segmentation_deepseek.git
            if [ ! -d "$APP_DIR/.git" ]; then
              mkdir -p /opt && rm -rf "$APP_DIR" && git clone "$REPO_URL" "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch origin --progress
            git checkout main
            git reset --hard origin/main
            chmod +x deploy/remote_deploy.sh
            APP_DIR="$APP_DIR" DEPLOY_PHASE=sync bash deploy/remote_deploy.sh

      - name: "2 · Env + firewall"
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SELECTEL_HOST }}
          username: ${{ secrets.SELECTEL_USER }}
          key: ${{ secrets.SELECTEL_SSH_KEY }}
          port: 22
          command_timeout: 3m
          request_pty: true
          script: |
            set -euo pipefail
            cd /opt/app
            APP_DIR=/opt/app DEPLOY_PHASE=env bash deploy/remote_deploy.sh
            APP_DIR=/opt/app DEPLOY_PHASE=firewall bash deploy/remote_deploy.sh

      - name: "3 · Postgres + Redis"
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SELECTEL_HOST }}
          username: ${{ secrets.SELECTEL_USER }}
          key: ${{ secrets.SELECTEL_SSH_KEY }}
          port: 22
          command_timeout: 10m
          request_pty: true
          script: |
            set -euo pipefail
            cd /opt/app
            APP_DIR=/opt/app DEPLOY_PHASE=pgcheck bash deploy/remote_deploy.sh
            APP_DIR=/opt/app DEPLOY_PHASE=infra bash deploy/remote_deploy.sh
            APP_DIR=/opt/app DEPLOY_PHASE=waitpg bash deploy/remote_deploy.sh
            APP_DIR=/opt/app DEPLOY_PHASE=restore bash deploy/remote_deploy.sh

      - name: "4 · Docker build web (long)"
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SELECTEL_HOST }}
          username: ${{ secrets.SELECTEL_USER }}
          key: ${{ secrets.SELECTEL_SSH_KEY }}
          port: 22
          command_timeout: 20m
          request_pty: true
          script: |
            set -euo pipefail
            cd /opt/app
            echo "Building… status file: /var/run/kinetic-deploy.status"
            APP_DIR=/opt/app DEPLOY_PHASE=build bash deploy/remote_deploy.sh

      - name: "5 · Health checks"
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SELECTEL_HOST }}
          username: ${{ secrets.SELECTEL_USER }}
          key: ${{ secrets.SELECTEL_SSH_KEY }}
          port: 22
          command_timeout: 3m
          request_pty: true
          script: |
            set -euo pipefail
            cd /opt/app
            APP_DIR=/opt/app DEPLOY_PHASE=health bash deploy/remote_deploy.sh
            echo "--- last status ---"
            cat /var/run/kinetic-deploy.status || true
            echo "--- log tail ---"
            tail -n 40 /var/log/kinetic-deploy.log || true

      - name: "6 · Summary"
        if: always()
        run: |
          echo "### Result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "https://kinetic-ai.ru/health" >> "$GITHUB_STEP_SUMMARY"
