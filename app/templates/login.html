{% extends layout_template|default("base.html") %}

{% block page_header %}{% endblock %}

{% block content %}
<section class="card login-card">
  <div class="login-brand">
    <img src="{{ static_asset('img/iris-logo.svg') }}" alt="Iris CRM" class="login-logo">
    <p class="login-tagline">Вход в Iris CRM</p>
  </div>
  <form class="login-form" method="post" action="/login" hx-boost="false">
    <input type="hidden" name="next" value="{{ next_url|default('/clients') }}">
    {% if error %}
    <p class="hint warn-hint">{{ error }}</p>
    {% endif %}
    <label>Логин
      <input type="text" name="username" value="{{ username|default('') }}" autocomplete="username" required autofocus>
    </label>
    <label>Пароль
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn">Войти</button>
  </form>
</section>
{% endblock %}
